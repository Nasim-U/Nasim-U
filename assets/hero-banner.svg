<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Nasim Uddin — Senior Data Scientist &amp; Systems Builder">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#111A2E" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="82%" cy="25%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowIndigo" cx="18%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162033" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.92" />
    </linearGradient>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#gridPattern)" />
  <rect width="1200" height="340" rx="16" fill="url(#glowCyan)" />
  <rect width="1200" height="340" rx="16" fill="url(#glowIndigo)" />
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Top Accent Bar -->
  <rect x="64" y="0" width="240" height="3" rx="1.5" fill="url(#accentLine)" />

  <!-- Availability / Status Badge -->
  <rect x="64" y="42" width="302" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <circle cx="80" cy="56" r="4.5" fill="#34D399" />
  <circle cx="80" cy="56" r="8" fill="#34D399" fill-opacity="0.22" />
  <text x="94" y="60" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">PRODUCTION DATA &amp; AI ARCHITECTURE</text>

  <!-- Primary Heading -->
  <text x="64" y="124" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.8">Nasim Uddin</text>

  <!-- Subtitle -->
  <text x="64" y="164" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">
    Senior Data Scientist &amp; Systems Builder
  </text>

  <!-- Value Proposition Tagline -->
  <text x="64" y="198" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
    Turning fragmented operational data into reliable pipelines, executive clarity &amp; autonomous workflows.
  </text>

  <!-- Core Pillars Pills -->
  <!-- Pillar 1 -->
  <g transform="translate(64, 232)">
    <rect width="236" height="34" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="17" r="3.5" fill="#38BDF8" />
    <text x="28" y="21.5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600">Automated Data Pipelines &amp; SQL</text>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(310, 232)">
    <rect width="194" height="34" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="17" r="3.5" fill="#818CF8" />
    <text x="28" y="21.5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600">Executive BI Dashboards</text>
  </g>

  <!-- Pillar 3 -->
  <g transform="translate(64, 276)">
    <rect width="204" height="34" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="17" r="3.5" fill="#34D399" />
    <text x="28" y="21.5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600">AI Agents &amp; MCP Servers</text>
  </g>

  <!-- Pillar 4 -->
  <g transform="translate(278, 276)">
    <rect width="182" height="34" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="17" r="3.5" fill="#F472B6" />
    <text x="28" y="21.5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600">Full-Stack Data Apps</text>
  </g>

  <!-- Right-Side Architecture Schematic Card -->
  <g transform="translate(770, 44)">
    <rect width="370" height="252" rx="12" fill="#0B1120" fill-opacity="0.88" stroke="#1E293B" stroke-width="1.2" />
    <!-- Window Header -->
    <rect x="0" y="0" width="370" height="32" rx="12" fill="#0F172A" />
    <rect x="0" y="20" width="370" height="12" fill="#0F172A" />
    <line x1="0" y1="32" x2="370" y2="32" stroke="#1E293B" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#334155" />
    <circle cx="32" cy="16" r="4.5" fill="#334155" />
    <circle cx="46" cy="16" r="4.5" fill="#334155" />
    <text x="242" y="20" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">system-topology.yml</text>

    <!-- Architecture Layers -->
    <!-- Layer 1: Ingestion & Medallion -->
    <rect x="22" y="50" width="326" height="46" rx="8" fill="#111C30" stroke="#1E3A5F" stroke-width="1" />
    <text x="36" y="69" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">01 // MEDALLION WAREHOUSE &amp; QA</text>
    <text x="36" y="85" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11">Python · SQL · DuckDB / Postgres / BigQuery</text>
    <rect x="292" y="63" width="42" height="18" rx="4" fill="#0C4A6E" />
    <text x="301" y="75.5" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">SLA+</text>

    <!-- Connector 1 -->
    <line x1="185" y1="96" x2="185" y2="112" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 2" />

    <!-- Layer 2: Semantic & MCP Layer -->
    <rect x="22" y="112" width="326" height="46" rx="8" fill="#131B33" stroke="#312E81" stroke-width="1" />
    <text x="36" y="131" fill="#818CF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">02 // SEMANTIC LAYER &amp; MCP TOOLS</text>
    <text x="36" y="147" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11">TypeScript · FastAPI · Deterministic Agent I/O</text>
    <rect x="292" y="125" width="42" height="18" rx="4" fill="#1E1B4B" />
    <text x="302" y="137.5" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">MCP</text>

    <!-- Connector 2 -->
    <line x1="185" y1="158" x2="185" y2="174" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 2" />

    <!-- Layer 3: Executive Apps & Anomaly Radar -->
    <rect x="22" y="174" width="326" height="54" rx="8" fill="#0E2225" stroke="#115E59" stroke-width="1" />
    <text x="36" y="194" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">03 // DECISION STUDIOS &amp; RADAR</text>
    <text x="36" y="212" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11">Executive KPIs · NL-to-SQL · Anomaly Alerts</text>
    <rect x="292" y="191" width="42" height="18" rx="4" fill="#064E3B" />
    <text x="300" y="203.5" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">LIVE</text>
  </g>
</svg>
